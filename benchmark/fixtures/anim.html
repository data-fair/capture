<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Anim</title>
<style>body { margin: 0; } canvas { display: block; }</style></head>
<body>
  <!-- the animation protocol of capture: triggerCapture(true), then animateCaptureFrame() once per
       frame until it returns true. ?frames=n -->
  <canvas id="c"></canvas>
  <script>
    const frames = Number(new URLSearchParams(location.search).get('frames') || 30)
    const c = document.getElementById('c')
    c.width = innerWidth; c.height = innerHeight
    const ctx = c.getContext('2d')
    const draw = (t) => {
      const g = ctx.createLinearGradient(0, 0, c.width, c.height)
      g.addColorStop(0, `hsl(${t * 6},70%,60%)`); g.addColorStop(1, `hsl(${t * 6 + 120},70%,40%)`)
      ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height)
      for (let i = 0; i < 40; i++) {
        ctx.beginPath()
        ctx.arc((i * 37 + t * 9) % c.width, (i * 53 + t * 5) % c.height, 10 + i % 15, 0, Math.PI * 2)
        ctx.fillStyle = `hsla(${i * 9},80%,50%,.7)`; ctx.fill()
      }
      ctx.fillStyle = '#000'; ctx.font = '32px sans-serif'; ctx.fillText('frame ' + t, 20, 50)
    }
    draw(0)
    setTimeout(async () => {
      if (!window.triggerCapture) return
      const animate = await window.triggerCapture(true)
      let t = 0
      window.animateCaptureFrame = () => { draw(t); t++; return t >= frames }
    }, 50)
  </script>
</body>
</html>
