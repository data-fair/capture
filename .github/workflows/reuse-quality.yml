name: Quality checks

on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install gifsicle
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gifsicle

    - name: Install dependencies
      run: npm ci

    # the minimal dev path: .env from dev/default.env, then the browser of the tests (the
    # version that matches puppeteer) and the generated types
    - name: Init .env
      run: cp dev/default.env .env

    - name: Dev setup
      run: npm run dev-setup

    - name: Lint
      run: npm run lint

    - name: Build types
      run: npm run build-types

    - name: Check types
      run: npm run check-types

    # no containers: the tests start the API in-process on TEST_API_PORT
    - name: Run tests
      run: npm run test

    - name: Audit dependencies
      run: npm audit --omit=dev --audit-level=critical
