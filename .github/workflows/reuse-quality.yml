name: Quality checks

on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    # google-chrome-stable is preinstalled on the runner, gifsicle is not
    - name: Install gifsicle
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gifsicle

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build types
      run: npm run build-types

    - name: Check types
      run: npm run check-types

    # no containers nor .env: the tests start the API in-process on port 5607
    - name: Run tests
      run: npm run test

    - name: Audit dependencies
      run: npm audit --omit=dev --audit-level=critical
